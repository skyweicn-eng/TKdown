<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TIKTOK MASTER - 云端极速版</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; background: linear-gradient(45deg, #00f2ea, #ff0050); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 20px 0; font-size: 28px; font-weight: bold; }
        textarea { width: 100%; height: 160px; background: #000; border: 1px solid #444; color: #00f2ea; padding: 12px; border-radius: 8px; box-sizing: border-box; font-family: monospace; outline: none; }
        button { width: 100%; background: #ff0050; border: none; padding: 16px; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 16px; transition: 0.3s; }
        button:hover { background: #ff0070; transform: scale(1.01); }
        #log { margin-top: 25px; width: 100%; max-width: 600px; }
        .item { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #00f2ea; }
        .dl-btn { background: #00f2ea; color: #000; padding: 6px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; cursor: pointer; border: none; }
        .dl-btn:hover { background: #00e0d8; }
    </style>
</head>
<body>
    <div class="box">
        <h1>TIKTOK MASTER Cloud</h1>
        <textarea id="links" placeholder="在这里粘贴 TikTok 链接，每行一个..."></textarea>
        <button onclick="startCloudParse()">🔥 云端极速解析</button>
    </div>
    <div id="log"></div>

    <script>
        async function startCloudParse() {
            const area = document.getElementById('links');
            const log = document.getElementById('log');
            const lines = area.value.split('\n').map(s => s.trim()).filter(s => s.startsWith('http'));

            if (lines.length === 0) return alert('请先粘贴链接');
            log.innerHTML = '<div style="color:#666; text-align:center;">🚀 服务器正在处理，请稍候...</div>';

            for (let url of lines) {
                try {
                    // 调用云端 Python 解析接口
                    const response = await fetch('/api/download', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ url: url })
                    });
                    const data = await response.json();
                    
                    const div = document.createElement('div');
                    div.className = 'item';
                    
                    if (data.status === 'success') {
                        div.innerHTML = `
                            <span style="width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">✅ ${data.title}</span>
                            <a href="${data.url}" target="_blank" class="dl-btn" download>保存视频</a>
                        `;
                    } else {
                        div.innerHTML = `<span style="color:#ff4d4d;">❌ ${data.message}</span>`;
                    }
                    log.appendChild(div);
                } catch (e) {
                    const err = document.createElement('div');
                    err.className = 'item';
                    err.innerHTML = `<span style="color:yellow;">❌ 网络错误，请重试</span>`;
                    log.appendChild(err);
                }
            }
        }
    </script>
</body>
</html>
