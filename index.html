<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TIKTOK MASTER - 育新创专属版</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 16px; width: 100%; max-width: 650px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; background: linear-gradient(45deg, #00f2ea, #ff0050); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 20px 0; font-size: 28px; font-weight: bold; }
        textarea { width: 100%; height: 160px; background: #000; border: 1px solid #444; color: #00f2ea; padding: 12px; border-radius: 8px; box-sizing: border-box; font-family: monospace; outline: none; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; border: none; padding: 16px; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-parse { background: #ff0050; }
        .btn-parse:hover { background: #ff0070; }
        .btn-dl-all { background: #00f2ea; color: #000; display: none; } /* 解析成功后才显示 */
        .btn-dl-all:hover { background: #00e0d8; }
        #log { margin-top: 25px; width: 100%; max-width: 650px; }
        .item { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #00f2ea; }
        .info { display: flex; flex-direction: column; width: 75%; }
        .author { font-weight: bold; color: #00f2ea; font-size: 14px; margin-bottom: 5px; }
        .desc { font-size: 12px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dl-btn { background: #333; border: 1px solid #555; color: #fff; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .dl-btn:hover { background: #444; }
    </style>
</head>
<body>
    <div class="box">
        <h1>TIKTOK MASTER Cloud</h1>
        <textarea id="links" placeholder="在这里粘贴 TikTok 链接，每行一个支持批量..."></textarea>
        <div class="btn-group">
            <button class="btn-parse" onclick="startCloudParse()">🔥 批量极速解析</button>
            <button id="dlAllBtn" class="btn-dl-all" onclick="downloadAll()">⬇️ 一键下载全部</button>
        </div>
    </div>
    <div id="log"></div>

    <script>
        let parsedVideos = []; // 用来存储所有解析成功的视频链接

        async function startCloudParse() {
            const area = document.getElementById('links');
            const log = document.getElementById('log');
            const dlAllBtn = document.getElementById('dlAllBtn');
            const lines = area.value.split('\n').map(s => s.trim()).filter(s => s.startsWith('http'));

            if (lines.length === 0) return alert('请先粘贴链接');
            
            // 初始化
            parsedVideos = []; 
            log.innerHTML = '<div style="color:#666; text-align:center;">🚀 服务器正在批量处理，请稍候...</div>';
            dlAllBtn.style.display = 'none';

            for (let url of lines) {
                try {
                    const response = await fetch('/api/download', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ url: url })
                    });
                    const data = await response.json();
                    const div = document.createElement('div');
                    div.className = 'item';
                    
                    if (data.status === 'success') {
                        parsedVideos.push(data.url); // 存入全局数组供一键下载使用
                        
                        div.innerHTML = `
                            <div class="info">
                                <span class="author">👤 ${data.author}</span>
                                <span class="desc">📝 ${data.title}</span>
                            </div>
                            <button onclick="triggerDownload('${data.url}')" class="dl-btn">单个保存</button>
                        `;
                    } else {
                        div.innerHTML = `<span style="color:#ff4d4d;">❌ 解析失败: ${data.message}</span>`;
                        div.style.borderLeftColor = '#ff4d4d';
                    }
                    log.appendChild(div);
                } catch (e) {
                    const err = document.createElement('div');
                    err.className = 'item';
                    err.innerHTML = `<span style="color:yellow;">❌ 网络错误，可能是该链接已失效</span>`;
                    err.style.borderLeftColor = 'yellow';
                    log.appendChild(err);
                }
            }

            // 如果有成功解析的视频，显示一键下载按钮
            if (parsedVideos.length > 0) {
                dlAllBtn.style.display = 'block';
                log.firstChild.innerText = `✅ 解析完成！共成功提取 ${parsedVideos.length} 个视频。`;
            }
        }

        // 触发浏览器静默下载
        function triggerDownload(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank'; // 新标签页打开/下载，绕过跨域限制
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 一键下载全部功能 (带有一点点延迟，防止浏览器拦截弹窗)
        function downloadAll() {
            if (parsedVideos.length === 0) return;
            alert(`准备开始下载 ${parsedVideos.length} 个视频。\n\n提示：浏览器可能会拦截多个下载请求，请在地址栏右上角点击“允许弹出窗口”。`);
            
            parsedVideos.forEach((url, index) => {
                setTimeout(() => {
                    triggerDownload(url);
                }, index * 800); // 每个视频间隔 0.8 秒触发，防止浏览器卡死或拦截
            });
        }
    </script>
</body>
</html>
